<!-- fulbot · Confirm signup (en). Supabase Dashboard -> Authentication -> Emails -> Confirm signup.
     Subject: Confirm your fulbot account
     The button goes to /api/auth/confirm, which verifies the token hash on the server,
     so the link works in any browser, the installed app or the mail app (docs/deploy.md). -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#173129;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#F3F0E6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#173129;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
            <tr>
              <td style="padding-bottom:24px;font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#F3F0E6;">fulbot</td>
            </tr>
            <tr>
              <td style="padding-bottom:12px;font-size:20px;font-weight:700;color:#F3F0E6;">Confirm your email</td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;font-size:15px;line-height:1.5;color:#C9CFC6;">Tap the button to confirm your account and sign in to fulbot. You can open it on any device.</td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next={{ .RedirectTo }}"
                   style="display:inline-block;background:#FF8A3D;color:#1A1A1A;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:3px;">Confirm my account</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.5;color:#9AA59C;">If you didn't create a fulbot account, ignore this email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
